name: Investing team daily run

# Patient Money's AI team: the CEO agent plans the day, worker agents do the work, and the
# founder gets a GitHub issue with the daily brief. The schedule stays OFF until you add the
# repository variable INVEST_AGENTS_ENABLED = true (Settings → Secrets and variables → Actions → Variables).
on:
  schedule:
    - cron: "41 12 * * *" # 12:41 UTC daily (about 7:41am US Eastern)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no AI calls, no cost)"
        type: boolean
        default: false

concurrency:
  group: invest-state
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.INVEST_AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Run the AI team
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INVEST_SITE_URL: ${{ vars.INVEST_SITE_URL }}
          INVEST_MAX_TASKS: ${{ vars.INVEST_MAX_TASKS }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m invest run-daily --dry-run
          elif [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret is not set. Running a dry run instead."
            python -m invest run-daily --dry-run
          else
            python -m invest run-daily
          fi
          echo "brief=invest/ops/briefs/$(date -u +%F).md" >> "$GITHUB_OUTPUT"

      - name: Save the team's memory and outputs
        run: |
          git config user.name "invest-agents"
          git config user.email "invest-agents@users.noreply.github.com"
          git add invest
          git diff --cached --quiet || git commit -m "Investing agents: daily run $(date -u +%F)"
          git push

      - name: Send the daily brief
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Patient Money brief $(date -u +%F)" --body-file "${{ steps.run.outputs.brief }}"
